name: Lean Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lean-check:
    uses: OmnisGenomics/.github/.github/workflows/maintenance.yml@main
    with:
      maintenance_command: nix run .#lean-check
      report_artifact_name: lean-check-report
      report_path: lean-check-report.md
      timeout_minutes: 60
    secrets: inherit
