name: Tier 0 Snapshots

on:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "profiles/**"
      - "Tests/profiles/**"
      - ".github/scripts/validate_snapshots.py"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

jobs:
  tier0-snapshots:
    uses: OmnisGenomics/.github/.github/workflows/maintenance.yml@main
    with:
      maintenance_command: nix run .#tier0-snapshots
      report_artifact_name: tier0-snapshots-report
      report_path: tier0-snapshots-report.md
      timeout_minutes: 60
    secrets: inherit
